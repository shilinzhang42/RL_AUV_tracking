defaults:
  - _self_
  - task: track_image

# 指向 DDPM AUV Workspace 类
name: train_ddpm_unet_image_auv
_target_: diffusion_policy.workspace.train_ddpm_unet_image_workspace_auv.TrainDDPMUnetImageWorkspaceAUV

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "ddpm_auv_test"

# 统一训练预算（用于 FM/DDPM 公平对比）
train_budget_steps: 100000

horizon: 32
n_obs_steps: 6
n_action_steps: 8
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
past_action_visible: False
keypoint_visible_rate: 1.0
obs_as_global_cond: True

policy:
  _target_: diffusion_policy.policy.ddpm_unet_image_policy_auv.DDPMUnetImagePolicyAUV

  shape_meta: ${shape_meta}
  
  # DDPM 调度器配置
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    num_train_timesteps: 1000
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    variance_type: fixed_small
    clip_sample: True
    prediction_type: epsilon

  obs_encoder:
    _target_: diffusion_policy.model.vision.AUVHybridObsEncoder.AUVHybridObsEncoder
    shape_meta: ${shape_meta}
    n_obs_steps: ${n_obs_steps}
    rgb_model:
      _target_: diffusion_policy.model.vision.model_getter.get_resnet
      name: resnet18
      weights: null
    resize_shape: [64, 64]
    crop_shape: [60, 60]
    random_crop: True
    use_group_norm: True
    share_rgb_model: False
    imagenet_norm: True

  horizon: ${horizon}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 50  # DDPM 通常需要更多步数采样，比 Flow Matching 多
  obs_as_global_cond: ${obs_as_global_cond}
  diffusion_step_embed_dim: 128
  
  # 内存优化：保持与 flow matching 相同的小规模
  down_dims: [256, 512, 1024]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: True

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 256
  num_workers: 6
  shuffle: True
  pin_memory: True
  persistent_workers: True

val_dataloader:
  batch_size: 256
  num_workers: 6
  shuffle: False
  pin_memory: True
  persistent_workers: True

optimizer:
  _target_: torch.optim.AdamW
  lr: 2.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 42
  debug: False 
  resume: False
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 15
  gradient_accumulate_every: 1
  use_ema: True
  freeze_encoder: False
  rollout_every: 50
  checkpoint_every: 1
  val_every: 1
  sample_every: 5
  tqdm_interval_sec: 1.0
  max_train_steps: ${train_budget_steps}
  max_val_steps: null

logging:
  repo: swanlab
  project: auv_tracking_ddpm
  resume: False
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "ddpm"]

checkpoint:
  topk:
    monitor_key: val_loss
    mode: min
    k: 5
    format_str: 'epoch={epoch:04d}-val_loss={val_loss:.4f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}

hydra:
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
